name: public-ci

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'annotations/**'
      - 'core-engine/**'
      - 'desktop-app/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'annotations/**'
      - 'core-engine/**'
      - 'desktop-app/**'

jobs:
  core-engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-pc-windows-gnu
      - name: Setup MinGW linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build Gradle modules and package Windows runtime
        run: |
          ./gradlew :annotations:build :core-engine:build
          test -s core-engine/build/core-engine/resources/main/META-INF/jsrt/windows-x64/jsrt_ffi.dll
          ! find core-engine/build/core-engine/resources/main -type f -name '*.dylib' -print -quit | grep -q .
        shell: msys2 {0}

  core-engine-linux:
    name: Core engine and Rust runtime (Linux x64 glibc 2.17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Check Rust formatting
        working-directory: core-engine/src/main/rust
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        working-directory: core-engine/src/main/rust
        run: cargo test --workspace --locked
      - name: Build Gradle modules and package Linux runtime
        run: |
          ./gradlew :annotations:build :core-engine:build -Pjavashroud.rust.platform=x86_64-unknown-linux-gnu.2.17
          test -s core-engine/build/core-engine/resources/main/META-INF/jsrt/linux-x64/libjsrt_ffi.so
          ! find core-engine/build/core-engine/resources/main -type f -name '*.dylib' -print -quit | grep -q .
        shell: bash

  desktop-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: corepack yarn install --immutable
        working-directory: desktop-app/frontend
      - name: Build frontend
        run: corepack yarn build
        working-directory: desktop-app/frontend
      - name: Verify desktop app Go module
        run: go build ./...
        working-directory: desktop-app
