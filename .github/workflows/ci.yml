name: published-rc2-desktop-cli

on:
  push:
    branches:
      - codex/published-rc2-desktop-cli-2026-11-28
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  published-desktop-cli-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record JDK 21 location
        run: '"VERIFY_JDK_21=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record JDK 17 location
        run: '"VERIFY_JDK_17=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - name: Install the existing UIAutomation driver dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'published-rc2-smoke/evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          python -m pip install --disable-pip-version-check pywinauto==0.6.9 psutil==7.0.0 pillow==11.3.0 1> "$evidence/dependencies.stdout.log" 2> "$evidence/dependencies.stderr.log"
          $result = $LASTEXITCODE
          @{ exit_code = $result } | ConvertTo-Json | Set-Content "$evidence/dependencies-exit.json"
          if ($result -ne 0) { throw "UIAutomation dependency installation failed with exit $result" }
          @{ workflow_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; image_os = $env:ImageOS; image_version = $env:ImageVersion } |
            ConvertTo-Json | Set-Content "$evidence/host.json"
      - name: Verify the published final NativeImage CLI and GUI file flow
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'published-rc2-smoke/evidence'
          python -u -X utf8 .github/diagnostics/rc2-desktop-smoke.py 1> "$evidence/harness.stdout.log" 2> "$evidence/harness.stderr.log"
          $result = $LASTEXITCODE
          @{ exit_code = $result } | ConvertTo-Json | Set-Content "$evidence/harness-exit.json"
          if ($result -ne 0) { throw "The actual packaged desktop flow failed with exit $result" }
          Get-Content -Raw -LiteralPath "$evidence/summary.json"
      - name: Retain the exact driver and hash the evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'published-rc2-smoke/evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item -LiteralPath .github/workflows/ci.yml -Destination "$evidence/workflow.yml"
          Copy-Item -LiteralPath .github/diagnostics/rc2-desktop-smoke.py -Destination "$evidence/rc2-desktop-smoke.py"
          Copy-Item -LiteralPath .github/diagnostics/rc2-package-pins.json -Destination "$evidence/rc2-package-pins.json"
          $manifest = Get-ChildItem -LiteralPath $evidence -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName).Replace('\', '/')
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
            }
          $manifest | Set-Content "$evidence/SHA256SUMS.txt"
      - name: Upload publication proof and actual GUI and CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-rc2-desktop-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/published-rc2-smoke/evidence
          if-no-files-found: error
          retention-days: 14
