name: windows-path-diagnostic

on:
  push:
    branches:
      - codex/windows-path-diagnostic-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-jdk21:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-pc-windows-gnu
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Setup MinGW linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Reproduce the real artifact failure
        run: >-
          ./gradlew.bat :core-engine:test
          --tests '*.AdvancedPassCombinationVerificationTest.single_pass_method_virtualization'
          --tests '*.HardenedReleaseGateTest.scan_rejects_build_machine_cwd_paths'
          '-Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64'
          --no-daemon
      - name: Print allowlisted path diagnostics
        if: always()
        shell: pwsh
        run: |
          $pattern = 'container=(?:class|PE|ELF|resource) category=(?:workspace|Cargo-registry|rustup|Zig|AppData-temp|other) alias=(?:escaped-backslash|backslash|forward-slash)'
          $diagnostics = Get-ChildItem -LiteralPath build/core-engine/test-results/test -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $report = [System.IO.File]::ReadAllText($_.FullName)
              [regex]::Matches($report, $pattern) | ForEach-Object { $_.Value }
            } | Sort-Object -Unique
          if ($diagnostics) { $diagnostics | Write-Output }
          else { Write-Output 'No path marker diagnostics in test reports' }
