name: public-ci

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'annotations/**'
      - 'core-engine/**'
      - 'desktop-app/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'annotations/**'
      - 'core-engine/**'
      - 'desktop-app/**'

jobs:
  core-engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-pc-windows-gnu
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Setup MinGW linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build Gradle modules and package Windows runtime
        run: ./gradlew.bat :annotations:build :core-engine:build
      - name: Verify packaged Windows runtime
        run: |
          test -s build/core-engine/resources/main/META-INF/jsrt/windows-x64/qp_ffi.dll
          ! find build/core-engine/resources/main -type f -name '*.dylib' -print -quit | grep -q .
        shell: msys2 {0}
      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/*/test-results/**/*.xml
            build/*/reports/tests/**
          if-no-files-found: warn

  core-engine-linux:
    name: Core engine and Rust runtime (Linux x64 glibc 2.17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Check Rust formatting
        working-directory: core-engine/src/main/rust
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        working-directory: core-engine/src/main/rust
        run: cargo test --workspace --locked
      - name: Build Gradle modules and package Linux runtime
        env:
          JAVASHROUD_REQUIRE_LINUX_NATIVE_FIXTURES: 'true'
        run: |
          ./gradlew :annotations:build :core-engine:build -Pjavashroud.rust.platform=x86_64-unknown-linux-gnu.2.17
          test -s build/core-engine/resources/main/META-INF/jsrt/linux-x64/libqp_ffi.so
          unzip -p build/core-engine/libs/obfuscator-engine-*.jar META-INF/jsrt/linux-x64/libqp_ffi.so |
            cmp - core-engine/src/main/rust/target/x86_64-unknown-linux-gnu/release/libqp_ffi.so
          ! find build/core-engine/resources/main -type f -name '*.dylib' -print -quit | grep -q .
        shell: bash
      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports-linux-jdk21
          path: |
            build/*/test-results/**/*.xml
            build/*/reports/tests/**
          if-no-files-found: warn

  android-runtime:
    name: Android API ${{ matrix.api }} x86_64 (${{ matrix.page_size }} byte pages)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            image: google_apis
            page_size: 4096
          - api: 26
            image: google_apis
            page_size: 4096
          - api: 35
            image: google_apis_ps16k
            page_size: 16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Install the owned fixture compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null'
      - name: Allow the hosted runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run owned APK runtime fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          ndk: 27.2.12479018
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            export ANDROID_SERIAL=emulator-5554
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
            export JAVASHROUD_ANDROID_DEVICE_TESTS=true
            export JAVASHROUD_ANDROID_EXPECT_API=${{ matrix.api }}
            export JAVASHROUD_ANDROID_EXPECT_PAGE_SIZE=${{ matrix.page_size }}
            export JAVASHROUD_APK_DEX2JAR_XMX=768m
            export JAVASHROUD_APK_D8_XMX=1024m
            ./gradlew :core-engine:test --tests '*.ApkAndroidDeviceSmokeTest' --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Pjavashroud.rust.platform=x86_64-unknown-linux-gnu.2.17
      - name: Upload Android device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api${{ matrix.api }}-x86_64-pages${{ matrix.page_size }}
          path: |
            build/android-runtime-evidence/**
            build/*/android-runtime-evidence/**
            build/*/test-results/**/*.xml
            build/*/reports/tests/**
          if-no-files-found: warn

  desktop-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: corepack yarn install --immutable
        working-directory: desktop-app/frontend
      - name: Test frontend
        run: corepack yarn check
        working-directory: desktop-app/frontend
      - name: Build frontend
        run: corepack yarn build
        working-directory: desktop-app/frontend
      - name: Test and build desktop app Go module
        run: |
          New-Item -ItemType Directory -Force -Path ../build/logs | Out-Null
          go test -count=1 -json ./... | Tee-Object -FilePath ../build/logs/desktop-go-tests.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
        working-directory: desktop-app
      - name: Upload desktop Go test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-go-test-evidence-${{ matrix.os }}
          path: build/logs/desktop-go-tests.jsonl
          if-no-files-found: warn
