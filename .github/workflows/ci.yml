name: packaged-desktop-smoke

on:
  push:
    branches:
      - codex/packaged-desktop-smoke-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-published-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record JDK 21 location
        run: '"VERIFY_JDK_21=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record JDK 17 location
        run: '"VERIFY_JDK_17=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - name: Prepare the isolated published desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'packaged-desktop-smoke'
          $evidence = Join-Path $root 'evidence'
          $download = Join-Path $root 'download'
          New-Item -ItemType Directory -Force -Path $evidence, $download | Out-Null
          gh release download v0.31.1 --repo HHT0rro/JavaShroud --pattern javashroud-windows-amd64.zip --pattern release-provenance.json --dir $download 1> "$evidence/download.stdout.log" 2> "$evidence/download.stderr.log"
          $downloadExit = $LASTEXITCODE
          @{ command = 'gh release download v0.31.1'; exit_code = $downloadExit } | ConvertTo-Json | Set-Content "$evidence/download.json"
          if ($downloadExit -ne 0) { throw "Download failed with exit $downloadExit" }
          $hash = (Get-FileHash -LiteralPath "$download/javashroud-windows-amd64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '80614ba64c89c9ec5fab49952313c4f8c19fc4a9f250073564a116c95e28fca8') { throw 'Published ZIP SHA-256 mismatch' }
          Copy-Item -LiteralPath "$download/release-provenance.json" -Destination $evidence
          python -m pip install --disable-pip-version-check playwright==1.56.0 pywinauto==0.6.9 psutil==7.0.0 pillow==11.3.0 1> "$evidence/dependencies.stdout.log" 2> "$evidence/dependencies.stderr.log"
          $installExit = $LASTEXITCODE
          @{ command = 'pip install pinned UI automation dependencies'; exit_code = $installExit } | ConvertTo-Json | Set-Content "$evidence/dependencies.json"
          if ($installExit -ne 0) { throw "Dependency installation failed with exit $installExit" }
          @{ workflow_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; image_os = $env:ImageOS; image_version = $env:ImageVersion } |
            ConvertTo-Json | Set-Content "$evidence/host.json"
      - name: Observe and operate the real packaged desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'packaged-desktop-smoke/evidence'
          python -X utf8 .github/diagnostics/packaged-desktop-smoke.py 1> "$evidence/harness.stdout.log" 2> "$evidence/harness.stderr.log"
          $harnessExit = $LASTEXITCODE
          @{ command = 'packaged-desktop-smoke.py'; exit_code = $harnessExit } | ConvertTo-Json | Set-Content "$evidence/harness-exit.json"
          if ($harnessExit -ne 0) { throw "Packaged desktop validation failed with exit $harnessExit" }
          $acceptance = Get-Content -Raw -LiteralPath "$evidence/acceptance.json" | ConvertFrom-Json
          Write-Output "Actual GUI coverage status $($acceptance.status)"
          Write-Output "Full GUI file flow $($acceptance.full_gui_file_flow)"
          Write-Output "Explicit minimal profile preserved $($acceptance.explicit_minimal_profile_preserved)"
      - name: Hash the retained desktop evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'packaged-desktop-smoke/evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item -LiteralPath .github/workflows/ci.yml -Destination "$evidence/workflow.yml"
          Copy-Item -LiteralPath .github/diagnostics/packaged-desktop-smoke.py -Destination "$evidence/packaged-desktop-smoke.py"
          $manifest = Get-ChildItem -LiteralPath $evidence -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($evidence, $_.FullName).Replace('\', '/')
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
            }
          $manifest | Set-Content "$evidence/SHA256SUMS.txt"
      - name: Upload actual desktop coverage and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-v0.31.1-${{ github.run_id }}
          path: ${{ runner.temp }}/packaged-desktop-smoke/evidence
          if-no-files-found: error
          retention-days: 14
