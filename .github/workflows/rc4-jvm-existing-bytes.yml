name: RC4 existing JVM package verification

on:
  push:
    branches:
      - codex/rc4-jvm-existing-bytes-20261128
    paths:
      - .github/workflows/rc4-jvm-existing-bytes.yml
      - .github/rc4-jvm-validation/**

permissions:
  contents: read

jobs:
  verify-existing-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_COMMIT: eca01095f7a945e2651e24eb0bd9f849d5f2c408
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validation workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: workflow
          persist-credentials: false
      - name: Checkout exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eca01095f7a945e2651e24eb0bd9f849d5f2c408
          path: product
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Record JDK17 path
        run: echo "JVM17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing distribution
        env:
          JVM21_HOME: ${{ env.JAVA_HOME }}
        run: python3 workflow/.github/rc4-jvm-validation/verify.py
      - name: Return verification evidence and existing package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc4-existing-linux-jvm-verification
          path: hosted-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
