[workspace]
resolver = "2"
members = [
    "crates/qp-ffi",
    "crates/qp-runtime",
    "crates/qp-crypto",
    "crates/qp-page",
    "crates/qp-resource",
    "crates/qp-vm",
    "crates/qp-shell",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "GPL-3.0-or-later"
repository = "https://github.com/HHT0rro/JavaShroud-public"

[workspace.dependencies]
qp-crypto = { path = "crates/qp-crypto" }
qp-page = { path = "crates/qp-page" }
qp-resource = { path = "crates/qp-resource" }
qp-vm = { path = "crates/qp-vm" }
qp-shell = { path = "crates/qp-shell" }
qp-runtime = { path = "crates/qp-runtime" }
qp-ffi = { path = "crates/qp-ffi" }
ruzstd = { version = "0.7.3", default-features = false, features = ["std"] }

[workspace.metadata.qp]
runtime_abi = "qp_ffi"
runtime_resource_root = "META-INF/jsrt"
rust_toolchain = "1.78.0"
windows_platform = "windows-x64"
windows_target = "x86_64-pc-windows-gnu"
linux_platform = "linux-x64"
linux_rustup_target = "x86_64-unknown-linux-gnu"
linux_zigbuild_target = "x86_64-unknown-linux-gnu.2.17"
linux_glibc_floor = "2.17"
cargo_zigbuild_version = "0.23.2"
zig_version = "0.13.0"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
incremental = false
strip = "symbols"
