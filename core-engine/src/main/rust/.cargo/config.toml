# Qp target policy.
# Linux glibc 2.17 is selected by cargo-zigbuild with the explicit
# x86_64-unknown-linux-gnu.2.17 command target; it is not a Rust target JSON
# and must not be installed through rustup.
[alias]
qp-windows-release = "zigbuild --locked --release --package qp-ffi --lib --target x86_64-pc-windows-gnu"
qp-linux-release = "zigbuild --locked --release --package qp-ffi --lib --target x86_64-unknown-linux-gnu.2.17"
