schemaVersion = '2'
engineVersion = '0.12'
vbcVersion = '4.55'
tags = [{id = 'metadata', name = '元数据混淆', description = '影响调试信息与类元数据可见性的混淆模块。', order = 10}, {id = 'renaming', name = '命名混淆', description = '影响类名、包名、字段名、方法名和参数名的混淆模块。', order = 20}, {id = 'encryption', name = '加密混淆', description = '对字符串、常量、数组等数据执行加密变换的混淆模块。', order = 30}, {id = 'obfuscation', name = '结构混淆', description = '对控制流、常量、指令序列等进行结构扰动的混淆模块。', order = 40}, {id = 'hiding', name = '隐藏混淆', description = '通过 synthetic/bridge 等标记隐藏成员以干扰反编译器与工具展示。', order = 50}, {id = 'loader-protection', name = '加载器保护', description = '类加密装载、方法体延迟解密、自定义 ClassLoader 部署等加载时保护模块。', order = 60}, {id = 'helper-deployment', name = 'Helper 部署', description = '隐藏类部署、helper 指纹随机化、运行时 helper 注入等模块。', order = 70}, {id = 'runtime-defense', name = '运行时防御', description = '调用点轮换、环境绑定、反 dump、反调试、多版本人格切换等运行时保护模块。', order = 80}, {id = 'vm-protection', name = '虚拟化保护', description = '方法级虚拟化、基础块局部虚拟化、多方言 VM 轮换等虚拟化保护模块。', order = 90}, {id = 'aggressive', name = '激进混淆', description = '利用 JVM 验证器绕过的激进混淆模块，产物需要 -noverify 启动。', order = 110}, {id = 'native-kernel', name = 'Native 内核', description = 'JNI/native 微内核协处理模块，需要平台特定原生库支持。', order = 120}]
modules = [{id = 'anti-decompiler-structure', name = 'Anti-Decompiler Structure', description = 'Insert bogus exception handlers and dead code blocks that confuse decompilers without affecting runtime behavior.', tagIds = ['obfuscation'], params = [], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：不应抬升输入 classfile major version；但可能改变类文件布局、反射可见性或运行时初始化路径，发布前请用目标业务场景验证。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'anti-dump-protection', name = '反内存转储', description = '通过 JNI/native 辅助降低 heap dump、class dump、hprof 等内存转储时的关键材料可见性。 field-scramble 是低强度 Java 字段扰动；jni-key-hold/full 依赖 native 可用性并在 native 缺失时 fail-closed。', tagIds = ['native-kernel', 'runtime-defense'], params = [{key = 'protectionLevel', type = 'enum', defaultValue = 'field-scramble', options = ['field-scramble', 'jni-key-hold', 'full'], description = '保护级别：field-scramble 为低强度字段扰动；jni-key-hold 将密钥持有在 JNI 层；full 启用 native 严格路径，native 不可用则拒绝。', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, platformConstraints = ['HotSpot JVM'], compatibilityNotes = '仅用于授权保护场景，可能与诊断、分析、heap 调试工具冲突。field-scramble 应保持输入 classfile major；jni-key-hold/full 要求 Java 11+、平台 native 库和 jni-microkernel-loader 成功加载。', requiredPassIds = ['jni-microkernel-loader'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'anti-instrumentation', name = '反插桩保护', description = '检测 -javaagent、ByteBuddy、常见 JVMTI/instrumentation transform 和运行时 class retransformation，并对 attach 痕迹进行探测，可选择记录、降级、拒绝或切换保护路径。', tagIds = ['native-kernel', 'runtime-defense'], params = [{key = 'detectionLevel', type = 'enum', defaultValue = 'standard', options = ['standard', 'aggressive'], description = '检测级别：standard 检查 -javaagent 与 JVMTI；aggressive 额外增加 ByteBuddy/attach 检测。', hidden = false}, {key = 'response', type = 'enum', defaultValue = 'log', options = ['log', 'degrade', 'refuse', 'switch-path'], description = '响应策略：log 仅记录；degrade 降低保护强度；refuse 拒绝运行；switch-path 切换保护路径。', hidden = false}, {key = 'seed', type = 'number', description = '确定性种子。', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '需要平台特定 native 库和 Java 11+ 目标运行时。可能与调试、测试、APM、游戏反作弊或监控工具冲突。仅用于授权保护场景。', requiredPassIds = ['jni-microkernel-loader'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'anti-symbolic-execution', name = 'Anti Symbolic Execution', description = 'Inject runtime-data-driven opaque predicates so symbolic execution tools cannot remove branches through constant constraint solving alone.', tagIds = ['runtime-defense'], params = [{key = 'trapDensity', type = 'number', defaultValue = 5, description = 'Inject one symbolic execution trap every N methods.', hidden = false}, {key = 'seed', type = 'number', description = 'Deterministic seed.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '会注入 Java 11/classfile 55 runtime helper；目标运行时需 Java 11+。会插入运行时数据相关分支，请验证性能、监控工具和符号执行/测试环境兼容性。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'callsite-rotation-protection', name = 'Callsite Rotation Protection', description = 'Experimental medium-strength callsite perturbation: switch call targets at runtime with MutableCallSite, epoch, counter, thread-local, or random signals to raise static recovery cost. It is observable at runtime and is not a VM-level protection by itself.', tagIds = ['runtime-defense'], params = [{key = 'rotationStrategy', type = 'enum', defaultValue = 'epoch', options = ['epoch', 'counter', 'thread-local', 'random'], description = 'Rotation strategy.', hidden = false}, {key = 'seed', type = 'number', description = 'Deterministic seed.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Changes callsite linking and runtime dispatch paths; generated helper/callsite surfaces target Java 11+ runtime behavior. Verify performance, debugging, framework proxy, and older runtime scenarios. Treat as cost-raising dispatch indirection, not a hard anti-hook boundary.', targeting = {supported = true, targetKinds = ['class']}}, {id = 'class-encryption-loader', name = '类加密装载器', description = '将选定 .class 主体以认证加密资源存放，由运行时自定义 ClassLoader 解密 defineClass。 aes-128/aes-256 表示 AES-GCM 密钥长度；密钥从 sealed native runtime root 派生， metadata、class name、resource path 和 sealing context 参与 AAD，认证失败时拒绝加载。', tagIds = ['loader-protection', 'encryption'], params = [{key = 'encryptionStrategy', type = 'enum', defaultValue = 'aes-128', options = ['aes-128', 'aes-256'], description = '类主体认证加密策略；aes-128/aes-256 表示 AES-GCM key size。', hidden = false}, {key = 'keyMode', type = 'enum', defaultValue = 'per-class', options = ['per-class', 'global'], description = '密钥作用域：per-class 为每个类生成独立派生材料，global 为所有加密类共享派生材料；作用域进入 AEAD AAD。', hidden = false}, {key = 'seed', type = 'number', description = '非秘密个性化种子，用于名称和 metadata 随机化；null 表示随机。', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '需要 jni-microkernel-loader 与平台 native 库；运行目标通常要求 Java 11+。native 不可用、metadata 篡改或资源篡改会 fail-closed。会改变类加载路径，请重点验证反射、资源路径和自定义 ClassLoader 场景。', requiredPassIds = ['jni-microkernel-loader'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'condy-constant-indirection', name = 'ConstantDynamic Constant Indirection', description = 'Replace LDC string and integer constants with CONSTANT_Dynamic bootstrap resolution. Exploits JVMS 4.4.10 (CONSTANT_Dynamic_info) which most decompilers lack full support for.', tagIds = ['obfuscation'], params = [], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 11+/classfile 55+ 特性：只应对 Java 11 及以上 classfile 写入 CONSTANT_Dynamic；Java 8/classfile 52 输入必须跳过或回退，不能写入 CONSTANT_Dynamic，也不应抬升 major version。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'control-flow-flattening', name = 'Control Flow Flattening', description = 'Medium-strength control-flow perturbation that flattens selected method control flow using configurable density, handler complexity, and insertion patterns. It raises CFG recovery cost but is not a complete VM-level protection.', tagIds = ['obfuscation'], params = [{key = 'density', type = 'number', defaultValue = 5, description = 'Flattening density from 1 (minimal) to 10 (aggressive).', hidden = false}, {key = 'handlerComplexity', type = 'enum', defaultValue = 'nop', options = ['nop', 'field-write', 'method-call'], description = 'Handler body complexity: nop, field-write (synthetic field writes), method-call (insert synthetic no-op handler probes).', hidden = false}, {key = 'pattern', type = 'enum', defaultValue = 'dead-branch', options = ['arithmetic-nop', 'dead-branch', 'unreachable-method', 'field-noise'], description = 'Insertion pattern for dispatch blocks: arithmetic-nop (NOP sequences), dead-branch (unreachable code blocks), unreachable-method (synthetic dead methods), field-noise (synthetic field read/writes).', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '会重写异常区域和分发结构；Java 8 classfile 输入不应被抬升 major version。请重点验证异常敏感路径和性能表现。当前为中等强度扰动，不能替代 native/VM 级保护。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'control-flow-obfuscation', name = 'Control Flow Obfuscation', description = 'Restructure method control flow with parameterized opaque predicates, dispatch modes, and algebraic families to confuse CFG reconstruction.', tagIds = ['obfuscation'], params = [{key = 'branchInjection', type = 'enum', defaultValue = 'none', options = ['none', 'light', 'normal', 'aggressive'], description = 'Conditional-edge injection level based on state-field perturbation, combined with predicate and dispatch rewriting: none disables, aggressive is the highest level.', hidden = false}, {key = 'handlerSplit', type = 'enum', defaultValue = 'none', options = ['none', 'light', 'heavy'], description = 'Same-type exception handler split and relay level, combined with predicate and dispatch rewriting: none disables, heavy is the highest level.', hidden = false}, {key = 'density', type = 'number', defaultValue = 5, description = 'Obfuscation density level from 1 (minimal) to 10 (aggressive). Higher values insert more opaque predicates and dispatch nodes.', hidden = false}, {key = 'dispatchMode', type = 'enum', defaultValue = 'if-chain', options = ['lookupswitch', 'if-chain', 'tableswitch-hybrid'], description = 'Dispatch mechanism for control flow restructuring: lookupswitch (table-driven), if-chain (conditional branch chains), tableswitch-hybrid (combined approach).', hidden = false}, {key = 'algebraicFamily', type = 'enum', defaultValue = 'mixed', options = ['quadratic-residue', 'bitwise-identity', 'modular-arithmetic', 'mixed'], description = 'Algebraic identity family for guard conditions.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：不应抬升输入 classfile major version；但可能改变类文件布局、反射可见性或运行时初始化路径，发布前请用目标业务场景验证。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'environment-bound-keys', name = 'Environment Bound Keys', description = 'Bind runtime key derivation to normalized hardware, JVM parameter, certificate fingerprint, or combined environment material through the sealed native KDF. Missing required material or binding mismatch is fail-closed.', tagIds = ['runtime-defense'], params = [{key = 'bindingSource', type = 'enum', defaultValue = 'jvm-params', options = ['hardware-id', 'jvm-params', 'certificate-fingerprint', 'combined'], description = 'Key binding source.', hidden = false}, {key = 'seed', type = 'number', description = 'Deterministic seed.', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Requires jni-microkernel-loader, Java 11+ runtime, and stable runtime binding material; environment changes directly affect decryption and startup behavior. Combined mode requires all configured material to be present.', requiredPassIds = ['jni-microkernel-loader'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'exception-semantic-virtualization', name = 'Exception Semantic Virtualization', description = 'Experimental semantic transformation that converts selected normal control flow to exception-driven flow using custom exception types. It raises decompiler and debugging cost but is not a complete VM-level virtualization layer.', tagIds = ['runtime-defense'], params = [{key = 'virtualizationLevel', type = 'enum', defaultValue = 'selective', options = ['selective', 'aggressive'], description = 'Virtualization level.', hidden = false}, {key = 'seed', type = 'number', description = 'Deterministic seed.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '会注入 Java 11/classfile 55 runtime helper；目标运行时需 Java 11+。会改变异常语义、堆栈形态和性能特征，需验证异常敏感路径。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'field-string-encryption', name = 'Field String Encryption', description = 'Encrypt static final String field constant values with AES, injecting clinit decrypt stubs. Prevents string constants from appearing in the constant pool as plaintext. Fusion from jar-obfuscator.', tagIds = ['encryption'], params = [], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：不应抬升输入 classfile major version；但可能改变类文件布局、反射可见性或运行时初始化路径，发布前请用目标业务场景验证。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'integer-constant-obfuscation', name = 'Integer Constant Obfuscation', description = 'Replace integer constant loads with arithmetic equivalent expressions to break pattern matching.', tagIds = ['obfuscation'], params = [{key = 'rewriteMode', type = 'enum', defaultValue = 'arithmetic', options = ['arithmetic', 'resolver'], description = 'Rewriting mode: arithmetic preserves arithmetic-equivalent rewriting; resolver replaces constants with class-local resolver call sites.', hidden = false}, {key = 'intCoverage', type = 'enum', defaultValue = 'none', options = ['none', 'normal', 'aggressive'], description = 'Integer constant coverage level for resolver mode: none disables, aggressive is the highest level.', hidden = false}, {key = 'longCoverage', type = 'enum', defaultValue = 'none', options = ['none', 'normal'], description = 'Long constant coverage level for resolver mode: none disables, normal is the highest level.', hidden = false}, {key = 'resolverCodec', type = 'enum', defaultValue = 'xor', options = ['xor', 'des'], description = 'Resolver payload codec for resolver mode.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：不应抬升输入 classfile major version；但可能改变类文件布局、反射可见性或运行时初始化路径，发布前请用目标业务场景验证。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'invoke-dynamic-indirection', name = 'InvokeDynamic Indirection', description = 'Replace INVOKESTATIC method calls with INVOKEDYNAMIC instructions backed by a per-class bootstrap lookup table.', tagIds = ['obfuscation'], params = [{key = 'callSiteForm', type = 'enum', defaultValue = 'bootstrap-table', options = ['bootstrap-table', 'constant-resolver'], description = 'Call-site form: bootstrap-table rewrites static calls through a per-class bootstrap lookup table; constant-resolver wraps class-local resolver members in first-resolve constant call sites.', hidden = false}, {key = 'seed', type = 'number', description = 'Deterministic seed for the constant-resolver call-site layout. Null or absent means random.', hidden = false}], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：输出可包含 invokedynamic，但不应抬升 classfile major version。会改变调用点链接形态，请验证反射、agent、AOT 和安全管理策略。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'jni-microkernel-loader', name = 'JNI 微内核加载器', description = '将 loader、解密或 VM 解释器等高价值保护内核下沉到 JNI/native 层。不将整个程序强制 native 化，只下沉保护核心。', tagIds = ['native-kernel'], params = [{key = 'kernelComponents', type = 'enum', defaultValue = 'loader', options = ['loader', 'decrypt', 'vm', 'guards', 'all'], description = '下沉的内核组件。loader 保持默认兼容；decrypt、vm、guards 或 all 会随 JNI 微内核声明对应 native 能力。', hidden = false}, {key = 'targetPlatform', type = 'string', defaultValue = 'auto', description = '原生微内核目标平台。支持 auto（当前构建平台）、all（全部受支持平台），或以逗号分隔的平台列表，例如 windows-x64,linux-x64。', hidden = false}, {key = 'diversifiedVirtualization', type = 'boolean', defaultValue = true, description = '多样化虚拟化混淆：开启后，下沉到 native 内核的保护逻辑使用种子多样化的虚拟指令编码，同一逻辑在不同构建/种子下产生不同的虚拟指令字节但语义保持不变，提高静态去虚拟化难度。', hidden = true}, {key = 'nativeRecompilation', type = 'boolean', defaultValue = true, description = '混淆时编译：开启后优先使用 JAVASHROUD_ZIG 或系统 PATH 中的 Zig；缺失时自动下载到用户目录 .javashroud/zig/0.13.0（Windows 形如 C:\Users\<用户名>\.javashroud\zig\0.13.0），再从内置 C 源码重编译 native 微内核；该选项必须开启，工具链获取失败或编译失败时终止本次混淆，不使用预编译 native 回退路径。', hidden = false}, {key = 'nativeProtectionLevel', type = 'enum', defaultValue = 'standard', options = ['standard', 'aggressive'], description = 'native 反逆向保护级别。standard 包含反调试、源码多样化重编译与反反汇编 guard；aggressive 额外启用反虚拟机检测、完整性自校验和反脱壳保护。', hidden = true}, {key = 'nativePackingLevel', type = 'enum', defaultValue = 'max', options = ['off', 'standard', 'max', 'max-hardening'], description = 'Zig 编译后 native 加固档位。off 保持不加外壳的原生动态库；standard 保留可加载前缀并追加认证 overlay；max 生成兼容的 stub shell；max-hardening 使用更强的外壳与完整 js_kernel 认证 payload。四档统一采用 AKEN v4 资源级 evaluator，档位只改变 native 外壳与载荷封装强度。', hidden = false}, {key = 'seed', type = 'number', description = '确定性种子，控制 native 微内核多样化编码。', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, platformConstraints = ['Windows x64', 'Linux x64', 'macOS x64/arm64'], compatibilityNotes = '需要平台特定 native 库。混淆时优先使用 JAVASHROUD_ZIG 或系统 PATH 中的 Zig；缺工具链时自动下载到用户目录 .javashroud/zig/0.13.0（Windows 形如 C:\Users\<用户名>\.javashroud\zig\0.13.0）后重编译 native 微内核；失败则终止本次混淆，不使用预编译 native 回退路径。只能与类加密、方法虚拟化或其他需要运行时 helper 的 pass 一起启用，不能单独启用.', requiresAnyPassIds = ['anti-dump-protection', 'anti-instrumentation', 'anti-symbolic-execution', 'callsite-rotation-protection', 'class-encryption-loader', 'environment-bound-keys', 'exception-semantic-virtualization', 'method-body-delayed-decryption', 'method-virtualization', 'string-encryption'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'member-hide', name = 'Member Hide', description = 'Mark fields and methods with the ACC_SYNTHETIC flag to hide them from IDEs and decompilers.', tagIds = ['hiding'], params = [], stability = 'experimental', risk = 'medium', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = 'Java 8 classfile 兼容：不应抬升输入 classfile major version；但可能改变类文件布局、反射可见性或运行时初始化路径，发布前请用目标业务场景验证。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'member-shuffle', name = 'Member Shuffle', description = 'Reorder classes, fields, methods, and JAR entries with independent build-local entropy.', tagIds = ['metadata'], params = [], stability = 'stable', risk = 'low', compatibilityNotes = '仅改变类、字段、方法和 JAR 条目的物理顺序，不改变声明与调用语义。', targeting = {supported = true, targetKinds = ['class']}}, {id = 'method-body-delayed-decryption', name = '方法体延迟解密', description = '保留类结构但将选定方法体搬入 AES-GCM 认证加密资源，调用时通过 hidden class 或运行时解密恢复方法体。 trampoline 只携带 v2 metadata，不携带 raw key；runtime 从 sealed native root 派生子密钥，认证失败时拒绝执行。', tagIds = ['loader-protection'], params = [{key = 'mode', type = 'enum', defaultValue = 'lazy-decrypt', options = ['lazy-decrypt', 'hidden-class-redirect'], description = '解密模式：lazy-decrypt 首次调用时解密恢复，hidden-class-redirect 跳转到 hidden class。', hidden = false}, {key = 'encryptionStrategy', type = 'enum', defaultValue = 'aes-128', options = ['aes-128', 'aes-256'], description = '方法体认证加密策略；aes-128/aes-256 表示 AES-GCM key size。', hidden = false}, {key = 'seed', type = 'number', description = '确定性种子。', hidden = false}], stability = 'experimental', risk = 'high', requiresOptIn = true, defaultEnabled = false, compatibilityNotes = '需要 jni-microkernel-loader 与平台 native 库；lazy-decrypt 模式通常要求 Java 11+ helper，hidden-class-redirect 模式需要 JDK 15+。native 不可用、metadata 篡改或资源篡改会 fail-closed。会改变方法体恢复和调用路径。', requiredPassIds = ['jni-microkernel-loader'], targeting = {supported = true, targetKinds = ['class']}}, {id = 'method-virtualization', name = '方法级虚拟化', description = '将选定方法 lowering 为 VBC4-only native bytecode VM 资源，并通过 JNI native dispatcher 执行；旧版 VM 资源 fail-closed。', tagIds = ['vm-protection'], params = [{key = 'seed', type = 'number', description = '非秘密个性化输入；输出仍由每产物 CSPRNG 材料随机化，不保证复现 VM key、布局、资源路径或 native profile。', hidden = false}, {key = 'methodSelection', type = 'enum', defaultValue = 'critical-plus', options = ['safe', 'critical-auto', 'critical-plus', 'all-compatible'], description = '广义类规则的方法选择策略：safe 保留小型非覆盖方法选择；critical-auto 自动选择 VM 兼容且带字段、调用、类型、分支、异常或 invokedynamic 信号的关键方法；critical-plus 在 critical-auto 基础上额外纳入含分支或非平凡规模的纯计算方法；all-compatible 强制选择所有 VM 兼容方法。显式方法规则仍优先。', hidden = false}, {key = 'strictVirtualization', type = 'boolean', defaultValue = true, description = '严格虚拟化：对 methodSelection 选中的广义类规则方法和显式方法规则执行 fail-closed；构造器、类初始化器、abstract/native 方法除外。遇到当前 VBC4 不支持的字节码或超过 maxInstructions 时 fail-closed 报错，不再静默保留明文实现。预算外或未被 methodSelection 选中的广义类规则方法保持原样。显式方法规则仍优先。', hidden = false}, {key = 'maxInstructions', type = 'number', defaultValue = 99999, description = '单个方法允许虚拟化的最大字节码指令数；非严格模式下超过阈值保持原样，严格模式下超过阈值会报错。默认 99999，确保显式命中的大型 VBC4/热点方法不会因默认阈值被跳过。', hidden = false}, {key = 'maxBr